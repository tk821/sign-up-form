<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <aside class="left">
        <div class="sidebar">
            <img id="logo" src="logos/logo.png" alt="Odin Logo">
            ODIN
        </div>
        <div class="footer">
            Photo taken by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a>
        </div>
    </aside>
    <div class="right">
        <div class="text">
            <p class="top">
                This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. 
                Sign up <em>now</em> to get started.
            </p>
            <p class="bottom">
                You <em>know</em> you want to.
            </p>
        </div>

        <form action="/actionpage.php" method="get" id="user">
            <div class="info">
                <p>Let's do this!</p>

                <div id="row-1">
                    <div class="pair" id="first-name">
                        <label for="first-name">First Name</label>
                        <input type="text" name="first-name">
                    </div>
                    <div class="pair" id="last-name">
                        <label for="last-name">Last Name</label>
                        <input type="text" name="last-name">
                    </div>
                </div>

                <div id="row-2">
                    <div class="pair" id="email">
                        <label for="email">Email</label>
                        <input type="email" name="email">
                    </div>
                    <div class="pair" id="phone-number">
                        <label for="phone-number">Phone Number</label>
                        <input type="tel" name="phone-number">
                    </div>
                </div>

                <div id="row-3">
                    <div class="pair" id="password">
                        <label for="password">Password</label>
                        <input type="password" name="password">
                    </div>
                    <div class="pair" id="password-confirm">
                        <label for="password-confirm">Confirm Password</label>
                        <input type="password" name="password-confirm">
                    </div>
                </div>
            </div>
            <div id="buttons-wrapper">
                <div class="buttons">
                    <button id="submit-button" type="submit">Create Account</button>
                    <div id="log-in">
                        Already have an account?
                        <a href="https://wikipedia.com">Log in</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
